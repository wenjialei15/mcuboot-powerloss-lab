name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch MCUboot (pinned) and its mbedtls submodule
        run: |
          git submodule update --init third_party/mcuboot
          git -C third_party/mcuboot submodule update --init ext/mbedtls-3.6.0

      - name: Build
        run: make

      - name: Run power-loss sweep
        run: |
          ./build/powerloss-lab | tee build/report.txt
          cat build/report.txt >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
